<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Jesus Reigns 2026 Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--navy:#061833;--gold:#e7b52c;--gold2:#c8921a;--bg:#faf3e6;--card:#fff;--ink:#0d1b33;--muted:#5b6478;--line:#e2e5ec;--err:#c0392b}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Outfit,system-ui,sans-serif}
header{background:var(--navy);color:#fff;padding:14px max(4vw,16px);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header img{height:52px}
header h1{font:700 clamp(18px,3vw,24px) Cinzel,serif;margin:0;color:var(--gold)}
header span{color:#c9d2e6;font-size:14px}
.wrap{max-width:1240px;margin:0 auto;padding:24px max(4vw,16px)}
.card{background:var(--card);border-radius:16px;box-shadow:0 10px 30px -18px rgba(6,24,51,.4);padding:20px}
.login{max-width:420px;margin:40px auto}
label{font-weight:700;display:block;margin-bottom:6px}
input{width:100%;font:16px Outfit,sans-serif;padding:12px 14px;border:1.5px solid #d5d9e2;border-radius:10px;min-height:46px}
input:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 4px rgba(231,181,44,.25)}
.btn{border:0;border-radius:10px;min-height:46px;padding:0 18px;font:700 16px Outfit,sans-serif;cursor:pointer;background:linear-gradient(180deg,#f8dc7a,var(--gold) 45%,var(--gold2));color:#0d1b33}
.btn.ghost{background:none;border:1.5px solid var(--gold)}
.btn:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.err{color:var(--err);margin-top:10px;min-height:1.5em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.stat b{display:block;font:700 clamp(30px,5vw,44px)/1.1 Outfit;color:var(--navy)}
.stat span{color:var(--muted)}
#sLast{font-size:clamp(20px,2.4vw,26px);padding:8px 0 6px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar input{flex:1 1 240px;width:auto}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#f6f1e4;font-weight:700;position:sticky;top:0}
td.n{text-align:right;font-weight:700}
td.w{white-space:normal;min-width:220px}
.empty{padding:30px;text-align:center;color:var(--muted)}
#app{display:none}
.tabs{display:flex;gap:6px}
.tab{border:1.5px solid #d5d9e2;background:#fff;border-radius:10px;min-height:46px;padding:0 14px;font:600 15px Outfit,sans-serif;cursor:pointer}
.tab[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
tr.g td{background:#fbf3dc;font-weight:700;border-top:2px solid var(--gold)}
tr.e td:first-child{padding-left:32px;color:#33405a}
.pill{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:99px;background:var(--navy);color:#fff;font-size:12px;font-weight:600;vertical-align:2px}
</style>
</head>

  <div><h1>2026 Registrations</h1><span>Admin dashboard</span></div>
</header>

<div class="wrap">
  <form class="card login" id="login">
    <label for="key">Admin key</label>
    <input id="key" type="password" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button class="btn" type="submit" style="width:100%">Open dashboard</button>
  </form>

  <div id="app">
    <div class="stats">
      <div class="card stat"><b id="sChurch">0</b><span>Churches</span></div>
      <div class="card stat"><b id="sReg">0</b><span>Registrations</span></div>
      <div class="card stat"><b id="sDel">0</b><span>Total delegates</span></div>
      <div class="card stat"><b id="sLast">—</b><span>Latest registration</span></div>
    </div>
    <div class="card">
      <div class="bar">
        <input id="q" type="search" placeholder="Search church, pastor, location…">
        <div class="tabs">
          <button class="tab" id="vGroup" type="button" aria-pressed="true">By church</button>
          <button class="tab" id="vAll" type="button" aria-pressed="false">All entries</button>
        </div>
        <button class="btn ghost" id="refresh" type="button">Refresh</button>
        <button class="btn" id="xlsx" type="button">Export to Excel</button>
      </div>
      <div class="scroll"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
    </div>
  </div>
</div>

<script>
{
  /* Set SCRIPT_URL in Vercel → Settings → Environment Variables (served by /api/config).
     You can also paste the Web App URL (ends with /exec) here as a fallback. */
  let SCRIPT_URL = "";
  const config = fetch("/api/config").then(r => r.ok ? r.json() : {}).then(c => { if (c.scriptUrl) SCRIPT_URL = c.scriptUrl; }).catch(() => {});
  const YEAR = 2026, LAST_YEAR = 2025;

  const $ = id => document.getElementById(id);
  let headers = [], rows = [], key = "", view = "group";
  try { key = sessionStorage.getItem("jr-admin") || ""; } catch (e) {}
  const col = name => headers.indexOf(name);

  /* "CFF Surigao", "cff  surigao.", "CFF SURIGAO" → same church */
  const norm = s => String(s).toLowerCase().replace(/[.,'’"]/g, "").replace(/\s+/g, " ").trim();

  /* oldest first so numbering follows registration order */
  function groups() {
    const map = new Map(), C = col("Church"), D = col("Delegates");
    rows.slice().reverse().forEach(r => {
      const k = norm(r[C]);
      if (!map.has(k)) map.set(k, { name: String(r[C]).trim().replace(/\s+/g, " ").toUpperCase(), items: [], total: 0 });
      const g = map.get(k); g.items.push(r); g.total += Number(r[D]) || 0;
    });
    return [...map.values()].sort((a, b) => a.name.localeCompare(b.name));
  }

  async function load() {
    await config;
    if (!SCRIPT_URL) throw new Error("SCRIPT_URL is not set. Add it in Vercel → Settings → Environment Variables, then redeploy.");
    const res = await fetch(SCRIPT_URL + "?action=list&key=" + encodeURIComponent(key));
    const out = await res.json();
    if (!out.ok) throw new Error(out.error);
    headers = out.headers; rows = out.rows.reverse(); // newest first
    render();
  }

  const cell = (tr, v, cls) => { const c = document.createElement("td"); c.textContent = v == null ? "" : v; if (cls) c.className = cls; tr.append(c); return c; };
  const head = list => { const tr = document.createElement("tr"); list.forEach(h => { const th = document.createElement("th"); th.textContent = h; tr.append(th); }); $("th").replaceChildren(tr); };

  function render() {
    const q = $("q").value.trim().toLowerCase(), D = col("Delegates");
    const gs = groups();
    $("sChurch").textContent = gs.length;
    $("sReg").textContent = rows.length;
    $("sDel").textContent = rows.reduce((s, r) => s + (Number(r[D]) || 0), 0).toLocaleString();
    $("sLast").textContent = rows[0] ? rows[0][col("Timestamp")] : "—";
    const tb = $("tb"); tb.textContent = "";
    const match = r => !q || r.join(" ").toLowerCase().includes(q);

    if (view === "all") {
      head(headers);
      rows.filter(match).forEach(r => {
        const tr = document.createElement("tr");
        r.forEach((v, i) => cell(tr, v, i === D ? "n" : headers[i] === "Notes" ? "w" : ""));
        tb.append(tr);
      });
    } else {
      head(["Church", "Delegates", "Pastor", "Location", "Reference No.", "Timestamp", "Notes"]);
      gs.forEach(g => {
        const items = g.items.filter(match);
        if (!items.length && !g.name.toLowerCase().includes(q)) return;
        const show = items.length ? items : g.items;
        const pick = r => [r[col("Pastor")], r[col("Location")], r[col("Reference No.")], r[col("Timestamp")], r[col("Notes")]];
        if (g.items.length === 1) {
          const tr = document.createElement("tr"), r = g.items[0];
          cell(tr, g.name); cell(tr, r[D], "n"); pick(r).forEach((v, i) => cell(tr, v, i === 4 ? "w" : ""));
          tb.append(tr); return;
        }
        const gr = document.createElement("tr"); gr.className = "g";
        const c = cell(gr, "GROUP " + g.name); const p = document.createElement("span"); p.className = "pill"; p.textContent = g.items.length + " entries"; c.append(p);
        cell(gr, g.total, "n"); for (let i = 0; i < 5; i++) cell(gr, "");
        tb.append(gr);
        g.items.forEach((r, i) => {
          if (!show.includes(r)) return;
          const tr = document.createElement("tr"); tr.className = "e";
          cell(tr, g.name + " " + (i + 1)); cell(tr, r[D], "n"); pick(r).forEach((v, j) => cell(tr, v, j === 4 ? "w" : ""));
          tb.append(tr);
        });
      });
    }
    if (!tb.children.length) {
      const tr = document.createElement("tr"); const c = cell(tr, rows.length ? "No matches." : "No registrations yet.", "empty");
      c.colSpan = 7; tb.append(tr);
    }
  }

  function setView(v) { view = v; $("vGroup").setAttribute("aria-pressed", v === "group"); $("vAll").setAttribute("aria-pressed", v === "all"); render(); }
  $("vGroup").addEventListener("click", () => setView("group"));
  $("vAll").addEventListener("click", () => setView("all"));

  $("login").addEventListener("submit", async e => {
    e.preventDefault(); key = $("key").value; $("loginErr").textContent = "Loading…";
    try {
      await load();
      try { sessionStorage.setItem("jr-admin", key); } catch (e) {}
      $("login").style.display = "none"; $("app").style.display = "block";
    } catch (err) { $("loginErr").textContent = err.message; }
  });

  $("q").addEventListener("input", render);
  $("refresh").addEventListener("click", async () => {
    $("refresh").textContent = "Loading…";
    let t = "Refresh";
    try { await load(); } catch (err) { t = "Retry (" + err.message + ")"; }
    $("refresh").textContent = t;
  });

  /* ---------- Excel export: 3 sheets ---------- */
  function exportXlsx() {
    const D = col("Delegates"), gs = groups();
    const grand = rows.reduce((s, r) => s + (Number(r[D]) || 0), 0);
    const wb = XLSX.utils.book_new();

    // 1) By Church — duplicates grouped (collapsible in Excel), subtotal per group
    const H1 = ["Church", "Delegates", "Entries", "Pastor", "Location", "Reference No.", "Timestamp", "Notes"];
    const a = [H1], levels = [{}];
    gs.forEach(g => {
      const info = r => [r[col("Pastor")], r[col("Location")], r[col("Reference No.")], r[col("Timestamp")], r[col("Notes")]];
      if (g.items.length === 1) { const r = g.items[0]; a.push([g.name, Number(r[D]) || 0, 1, ...info(r)]); levels.push({}); return; }
      const top = a.length + 1; // excel row of group header
      a.push(["GROUP " + g.name, { f: `SUM(B${top + 1}:B${top + g.items.length})`, v: g.total }, g.items.length, "", "", "", "", ""]); levels.push({});
      g.items.forEach((r, i) => { a.push([g.name + " " + (i + 1), Number(r[D]) || 0, "", ...info(r)]); levels.push({ level: 1 }); });
    });
    a.push([]); levels.push({});
    a.push(["GRAND TOTAL", grand, rows.length + " registrations", gs.length + " churches"]); levels.push({});
    const ws1 = XLSX.utils.aoa_to_sheet(a);
    ws1["!rows"] = levels;
    ws1["!cols"] = [{ wch: 38 }, { wch: 11 }, { wch: 16 }, { wch: 24 }, { wch: 32 }, { wch: 14 }, { wch: 18 }, { wch: 40 }];
    ws1["!freeze"] = { xSplit: 0, ySplit: 1 };
    XLSX.utils.book_append_sheet(wb, ws1, "By Church");

    // 2) Year Comparison — fill last year's numbers in column C; formulas do the rest
    const H2 = ["Church", YEAR + " Delegates", LAST_YEAR + " Delegates (enter)", "Difference", "% Change", "Status"];
    const b = [H2];
    gs.forEach((g, i) => {
      const n = i + 2;
      b.push([g.name, g.total, null,
        { f: `IF(C${n}="","",B${n}-C${n})` },
        { f: `IF(OR(C${n}="",C${n}=0),"",(B${n}-C${n})/C${n})`, z: "0.0%" },
        { f: `IF(C${n}="","",IF(B${n}>C${n},"Increase",IF(B${n}<C${n},"Decrease","Same")))` }]);
    });
    const last = gs.length + 1, t = last + 2;
    b.push([]);
    b.push(["TOTAL", { f: `SUM(B2:B${last})`, v: grand }, { f: `SUM(C2:C${last})` }, { f: `B${t}-C${t}` },
      { f: `IF(C${t}=0,"",(B${t}-C${t})/C${t})`, z: "0.0%" },
      { f: `IF(C${t}=0,"",IF(B${t}>C${t},"More delegates than ${LAST_YEAR}",IF(B${t}<C${t},"Fewer delegates than ${LAST_YEAR}","Same as ${LAST_YEAR}")))` }]);
    const ws2 = XLSX.utils.aoa_to_sheet(b);
    ws2["!cols"] = [{ wch: 38 }, { wch: 16 }, { wch: 22 }, { wch: 12 }, { wch: 11 }, { wch: 28 }];
    XLSX.utils.book_append_sheet(wb, ws2, "Year Comparison");

    // 3) All Registrations — raw data, oldest first, with filters
    const c = [headers, ...rows.slice().reverse()];
    const ws3 = XLSX.utils.aoa_to_sheet(c);
    ws3["!autofilter"] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: rows.length, c: headers.length - 1 } }) };
    ws3["!cols"] = headers.map(h => ({ wch: h === "Notes" ? 40 : ["Church", "Location"].includes(h) ? 32 : 16 }));
    XLSX.utils.book_append_sheet(wb, ws3, "All Registrations");

    const d = new Date(); const stamp = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    XLSX.writeFile(wb, "JesusReigns" + YEAR + "_Delegates_" + stamp + ".xlsx");
  }
  $("xlsx").addEventListener("click", exportXlsx);

  if (key) { $("key").value = key; $("login").requestSubmit(); }
}
</script>
